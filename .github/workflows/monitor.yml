name: Automobiliu skelbimu monitoringas

on:
  schedule:
    # Kas ~20 minučių, bet "nepopuliariomis" minutėmis (7, 27, 47), nes GitHub
    # daug dažniau praleidžia paleidimus apvaliomis minutėmis. Laikas - UTC.
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}  # leidžia paleisti rankiniu būdu iš Actions skirtuko

permissions:
  contents: write  # reikia, kad workflow galėtų commit'inti atnaujintą seen.json

jobs:
  check-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit updated seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Atnaujintas seen.json [skip ci]"
          git push
